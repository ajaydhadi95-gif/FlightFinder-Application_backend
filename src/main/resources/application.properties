server.port=5000

# ---- MySQL (override with environment variables when deploying) ----
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:flightfinder}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root123}

# Creates/updates the bookings table automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Frontend URL allowed to call this API
app.cors-origin=${CORS_ORIGIN:http://localhost:5173}
